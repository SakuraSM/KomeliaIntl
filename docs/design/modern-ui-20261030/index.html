<header><h1>Komelia 现代阅读界面</h1><p>18页视觉稿。沿用已确认的首页、书库与阅读设置，点击图片查看大图，使用方向键翻页。</p><p>这是静态设计与示例内容。目标逻辑尺寸和实际 PNG 像素分别记录。</p><nav class="links" aria-label="设计资料"><a href="README.md">页面索引</a><a href="overview.png">完整总览</a><a href="main-overview.png">主页面总览</a><a href="INTERACTIONS.md">交互对应</a><a href="DESIGN-SYSTEM.md">设计规则</a><a href="generation-record.json">生成记录</a></nav></header>
